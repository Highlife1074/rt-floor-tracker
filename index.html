<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RT Floor Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b2333;--mute:#6a7386;--line:#e2e5eb;--acc:#13406b;--acc2:#e8eef5;--done:#2f9e5f;--wip:#f2a71b;--blk:#d64040;--hp:#2d7ff9;--rad:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sticky{position:sticky;top:0;z-index:20}
header.top{background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px}.sub{opacity:.75;font-size:12px}
.sp{flex:1}
.sync{font-size:12px;opacity:.9}
.userchip{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 13px;font:inherit;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.nb{background:var(--blk);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px}
main{padding:16px;max-width:1500px;margin:0 auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.red{color:var(--blk);border-color:#f0c4c4}
.btn.sm{padding:4px 9px;font-size:12px}
select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{background:var(--acc2);color:var(--acc);border-radius:10px;padding:0 6px;font-size:11px;font-weight:700}
.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.floor{margin-bottom:24px}
.floor-h{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}.floor-h h2{margin:0;font-size:17px}
.bar{height:8px;background:#e3e6ec;border-radius:5px;overflow:hidden;flex:1;max-width:260px;min-width:80px}.bar>i{display:block;height:100%;background:var(--done)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--rad);padding:9px 10px 9px;cursor:pointer;font:inherit;color:inherit;border-top:6px solid #ccc;min-width:0}
.tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tile.is-blk{box-shadow:0 0 0 2px var(--blk)}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.t-top b{font-size:15px}
.t-name{color:var(--mute);font-size:12px;margin:1px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:2px;margin-bottom:7px}.segs i{flex:1;height:7px;border-radius:2px;background:#e3e6ec}
.segs i.s1{background:var(--wip)}.segs i.s2{background:var(--done)}.segs i.sb{background:var(--blk)}
.t-next{font-size:12px;display:flex;align-items:center;gap:6px;min-width:0}.t-next span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;white-space:nowrap}.badge.red{background:#fde8e8;color:var(--blk)}
.pct{font-weight:700;font-size:12px;color:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 14px}.legend span{display:inline-flex;gap:5px;align-items:center}
.sq{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid #c5cad4}
.empty{color:var(--mute);font-size:13px;padding:10px 0}
.mxwrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--rad);max-height:calc(100vh - 250px)}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;background:#fff;z-index:2;height:150px;vertical-align:bottom;padding:6px 2px}
.mx .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;margin:0 auto;display:flex;align-items:center;gap:4px}
.mx .rh{position:sticky;left:0;background:#fff;z-index:1;padding:4px 10px;min-width:190px;text-align:left;white-space:nowrap}
.mx thead .rh{z-index:3;vertical-align:bottom}
.mx a{color:var(--acc);text-decoration:none}
.mx td.c{width:30px;min-width:30px;height:27px;cursor:pointer;text-align:center;color:#fff;font-weight:800}
.mx td.c.hp.s0::after{content:'';display:inline-block;width:12px;height:12px;border:1.5px solid #c5cad4;border-radius:3px;vertical-align:middle}
.mx td.c.s1{background:var(--wip)}.mx td.c.s2{background:var(--done)}.mx td.c.b{background:var(--blk)}.mx td.c.b::after{display:none}
.mx td.na{background:repeating-linear-gradient(45deg,#f6f7f9,#f6f7f9 4px,#eceef2 4px,#eceef2 8px)}
.mx tr.fl td{background:var(--acc2);font-weight:700;padding:6px 10px}
.mx .hl{box-shadow:inset 0 0 0 2px var(--acc)}
.mx th.cmt{vertical-align:bottom;text-align:left;font-weight:600;padding:6px 8px;min-width:220px}
.mx td.cmt{padding:2px 4px;min-width:220px;max-width:320px}
.mx td.cmt input{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;font-size:12px;border-radius:6px}
.mx td.cmt input:hover,.mx td.cmt input:focus{border-color:var(--line);background:#fff}
.mx td.cmt input:not(:placeholder-shown){color:var(--ink)}
.mx td.c .sn{font-size:10px;font-weight:700;color:#a3aab6}
.mx td.c.s1 .sn,.mx td.c.s2 .sn{color:#fff}
.mx td.c.s0:not(.hp){box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5px #e1e4ea}
.mx td.c.oo{background-image:linear-gradient(225deg,#7e57c2 7px,transparent 7px)}
.mx td.c.cq{width:46px;min-width:46px;font-size:10px;font-weight:700;color:#5b6474}
.mx td.c.cq::after,.mx td.c.cq.hp.s0::after{display:none!important}.mx td.c.cq.s1,.mx td.c.cq.s2,.mx td.c.cq.b{color:#fff}
.mx.seq thead th{height:auto;padding:8px 2px;font-size:11px;color:var(--mute)}
.mx td.empty{background:#fafbfc}
#pop{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;display:none;max-width:300px}
#pop.open{display:block}
.heat{text-align:center;font-weight:600;font-size:12px;padding:6px 4px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s;z-index:50;overflow-y:auto}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:45;display:none}#scrim.open{display:block}
.dh{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
.db{padding:6px 16px 30px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow .an{flex:1;min-width:0}.arow small{display:block;color:var(--mute);font-size:11px}
.arow.blk .an b{color:var(--blk)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:7px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg .on0{background:#eef0f4;color:var(--ink);font-weight:700}.seg .on1{background:var(--wip);color:#fff;font-weight:700}.seg .on2{background:var(--done);color:#fff;font-weight:700}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:15px}
h3{font-size:12px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.bcard{border:1px solid var(--line);border-left:4px solid var(--blk);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.bcard.closed{border-left-color:var(--done);opacity:.75}
.bcard small{color:var(--mute)}
.tag{background:#eef0f4;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}.tag.green{background:#e3f4ea;color:var(--done)}.tag.red{background:#fde8e8;color:var(--blk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 10px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:3px 0}
details summary{cursor:pointer;padding:6px 0}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:18px;width:min(540px,100%);max-height:92vh;overflow:auto}
#modal h2{margin:0 0 12px;font-size:18px}
.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:12px;color:var(--mute);font-weight:600;flex:1}
table.tb{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tb th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mute);border-bottom:2px solid var(--line);padding:8px;white-space:nowrap}
.tb td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.tb tr.click{cursor:pointer}.tb tr.click:hover{background:#fafbfc}
.tb tr.grp td{background:var(--acc2);font-weight:700}
.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad)}
.overdue{color:var(--blk);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:12px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px}
.feed div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.feed small{color:var(--mute)}
.lnk{color:var(--acc);cursor:pointer;font-weight:700;text-decoration:underline}
/* hold points */
.segs i.hp{flex:0 0 7px;border-radius:50%}.segs i.hp.s1{background:var(--hp)}
.mx td.c.hp{width:22px;min-width:22px;background-color:#fafbfd}
.mx td.c.hp.s0::after{border-radius:2px;transform:rotate(45deg);width:9px;height:9px}
.mx td.c.hp.s1{background:var(--hp)}.mx td.c.hp.s2{background:var(--done)}
.mx th.hpcol .vt{font-weight:500;color:var(--mute);font-size:11px}
.arow.hp{padding-left:22px;background:linear-gradient(90deg,transparent 9px,#d5dae3 9px,#d5dae3 11px,transparent 11px)}
.arow.hp .an b{font-weight:600;font-size:13px}
.seg .on1.hpb{background:var(--hp)}
.hptag{font-size:10px;font-weight:700;color:var(--hp);border:1px solid var(--hp);border-radius:4px;padding:0 4px;margin-right:4px}
input.dt{padding:1px 4px;font-size:11px;border:1px dashed #c5cad4;border-radius:5px;color:var(--mute);background:transparent}
.chk.sub{padding-left:22px;color:var(--mute);font-size:12px}
/* weekly */
.delta{font-size:13px;font-weight:700}.delta.up{color:var(--done)}.delta.down{color:var(--blk)}.delta.flat{color:var(--mute)}
.banner{background:var(--acc);color:#fff;border-radius:var(--rad);padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trend svg{width:100%;height:auto;display:block}
/* login (same flow as MOM Tracker) */
#login{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f2945 0%,#173b63 60%,#21508a 100%);padding:16px;overflow-y:auto}
#login.open{display:flex}
.lg-logo{width:52px;height:52px;border-radius:13px;background:#c9a84c;color:#0f2945;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 12px}
.lg-card{background:#fff;border-radius:16px;padding:26px 28px;width:min(360px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lg-title{font-weight:800;font-size:18px;margin-bottom:2px}.lg-sub{font-size:12px;color:#888;margin-bottom:16px}
.lg-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.lg-p{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1.5px solid #e8e6df;background:#fafaf8;font:inherit;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.lg-p:hover{border-color:#c9a84c}
.lg-av{width:28px;height:28px;border-radius:50%;background:#f0ede6;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.pinbox{display:flex;gap:10px;justify-content:center;margin:4px 0 18px}.pinbox div{width:44px;height:52px;border:2px solid #e8e6df;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}.pinbox div.f{border-color:#c9a84c}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.keypad button{padding:13px;border-radius:8px;border:1.5px solid #e8e6df;background:#fafaf8;font:inherit;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink)}
.lg-err{padding:6px 10px;background:#fbe6e8;border-radius:7px;color:#b3302a;font-size:12px;margin-bottom:10px}
.lg-link{background:none;border:0;color:#888;cursor:pointer;font:inherit;font-size:12px;width:100%;text-align:center;margin-top:6px}
.lg-pinin{width:100%;font-size:22px;letter-spacing:10px;text-align:center}
body.ro [data-set],body.ro [data-newblk],body.ro [data-closeblk],body.ro .rwonly{display:none!important}
.seqed{border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0 10px;background:#fafbfc}
.sqrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;background:#fff;border:1px solid var(--line);margin-bottom:4px;font-size:13px}
.sqrow.over{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.sqn{width:20px;text-align:right;font-weight:700;color:var(--mute);font-size:12px;flex:none}
.grip{cursor:grab;color:#b6bcc8;font-size:12px;letter-spacing:-2px;flex:none}
.sqname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.printonly{display:none}
.planwrap{position:relative;overflow:auto;max-height:calc(100vh - 240px);min-height:320px;background:#fff;border:1px solid var(--line);border-radius:var(--rad)}
.planin{position:relative;min-width:100%}.planin img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;background:var(--c);color:#fff;font:700 11px/1 system-ui,sans-serif;padding:3px 6px;border-radius:9px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);text-shadow:0 0 2px rgba(0,0,0,.55);z-index:2}
.pin{text-align:center}.pin b{font-weight:700}.pin .pn{display:block;font-weight:600;font-size:10px;line-height:1.15;margin-top:2px;max-width:120px;white-space:normal}
.pin:hover{z-index:4;transform:translate(-50%,-50%) scale(1.15)}
.pin.blk{box-shadow:0 0 0 3px var(--blk),0 1px 4px rgba(0,0,0,.35)}.pin.dim{opacity:.22}.pin.sel{outline:3px solid var(--hp);z-index:3}
.pin.flash{animation:pinf .9s 4}@keyframes pinf{50%{transform:translate(-50%,-50%) scale(1.9)}}
.planin.editing .pin{touch-action:none;cursor:move}.planin.placing,.planin.placing img{cursor:crosshair}
.pedit{border-color:var(--hp);background:#f3f8ff}.pedit .chips{flex-wrap:wrap;max-height:120px;overflow:auto}
@media print{.sticky,.noprint,#drawer,#scrim,#modal{display:none!important}.printonly{display:block}body{background:#fff}main{padding:0;max-width:none}.tile{break-inside:avoid}.mxwrap,.tbwrap{max-height:none;overflow:visible;border:0}.tb tr{break-inside:avoid}.planwrap{max-height:none;overflow:visible;border:0}.planin{width:100%!important}}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}main{padding:10px}.seg button{padding:7px 7px}}
</style>
</head>
<body>
<div class="sticky">
  <header class="top">
    <div><div class="brand" id="pname">Riviera Tower</div><div class="sub">Floor finishes tracker</div></div>
    <span class="sp"></span><span class="sync" id="sync"></span>
    <button class="userchip" id="userchip" data-act="user">👤</button>
  </header>
  <nav class="tabs">
    <button data-view="overview">🗺 Overview</button>
    <button data-view="matrix">▦ Matrix</button>
    <button data-view="plans">📐 Plans</button>
    <button data-view="blockers">⚠ Blocking points<span class="nb" id="nbk"></span></button>
    <button data-view="weekly">📈 Weekly progress</button>
    <button data-view="dash">📊 Dashboard</button>
    <button data-view="setup" id="navsetup">⚙ Setup</button>
  </nav>
</div>
<main id="view"><div class="empty">Loading…</div></main>
<div id="scrim" data-act="close"></div>
<div id="drawer"></div>
<div id="modal"></div>
<div id="login"></div>
<div id="pop"></div>

<script type="module">
/* =====================================================================
   1) FIREBASE CONFIG — paste your Web App config here.
      Leave projectId empty to run in LOCAL MODE (data kept in this browser only).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBk6gWn06jUEH8D7kF6fOcYJE5_iGFdE6c",
  authDomain: "room-by.firebaseapp.com",
  projectId: "room-by",
  storageBucket: "room-by.firebasestorage.app",
  messagingSenderId: "102837488296",
  appId: "1:102837488296:web:4f701d21f86465def2909d"
};
const P = 'ft_';                       // Firestore collection prefix
const USE_FB = !!FIREBASE_CONFIG.projectId;

/* ===================== DEFAULT LIBRARY ===================== */
const DEFAULT_ACTS = [
  ['brick','Brickworks','BRK','#8d6e63'],
  ['bw','Builder works','BW','#a1887f'],
  ['mep1','MEP 1st fix','MEP1','#5c6bc0'],
  ['plas','Plastering','PLS','#90a4ae'],
  ['screed','Screed','SCR','#bcaaa4'],
  ['wp','Waterproofing','WP','#26a69a'],
  ['dry','Drywall & ceilings','DRY','#78909c'],
  ['tilef','Tiling – floor','TLF','#00897b'],
  ['tilew','Tiling – wall','TLW','#00acc1'],
  ['civ','Civil works finishes','CWF','#6d4c41'],
  ['pc','Paint – ceiling','PC','#7e57c2'],
  ['pw','Paint – walls','PW','#ab47bc'],
  ['spaint','Special paint','SP','#ec407a'],
  ['join','Doors & joinery','JNR','#c0874a'],
  ['mep2','MEP 2nd fix','MEP2','#3949ab'],
  ['snag','Snagging & clean','SNG','#546e7a'],
];
const PALETTE=['#e53935','#fb8c00','#fdd835','#7cb342','#00897b','#039be5','#3949ab','#8e24aa','#d81b60','#6d4c41','#546e7a'];
const LBL=['To do','In progress','Done'];

function defaultSettings(){
  const T=(id,name,list)=>({id,name,acts:list.split(',')});
  return {
    project:'Riviera Tower',
    seqV:2,
    people:[{name:APP_ADMIN,role:'admin'}],
    subs:[],
    floors:[{id:'f1',name:'Level 1'},{id:'f2',name:'Level 2'},{id:'f3',name:'Level 3'}],
    acts:DEFAULT_ACTS.map(([id,name,short,color])=>({id,name,short,color,hp:['mep1','wp'].includes(id)})),

/* ===================== ACCESS (same principle as MOM Tracker) =====================
   The admin keeps a list of people. On first login a person picks their name and chooses a
   4-digit PIN (stored hashed in ft_auth/pins); afterwards name + PIN. The device stays signed in.
   Roles: admin (everything incl. Setup) · edit (statuses, blocking points, notes) · view (read only). */
const APP_ADMIN='HORN, Philippe';
const normName=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
function simpleHash(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return Math.abs(h).toString(36);}
const isOwner=n=>normName(n)===normName(APP_ADMIN);
function peopleOf(s){const l=((s&&s.people)||[]).map(p=>({...p}));if(!l.some(p=>isOwner(p.name)))l.unshift({name:APP_ADMIN,role:'admin'});return l;}
const people=()=>peopleOf(S.settings);
function me(){const n=lsGet(LSU,'');if(!n||!S.settings)return null;return people().find(p=>normName(p.name)===normName(n))||null;}
const isAdmin=()=>{const m=me();return !!m&&(isOwner(m.name)||m.role==='admin');};
const isRO=()=>{const m=me();return !!m&&!isOwner(m.name)&&m.role==='view';};
const ROLES=[['admin','Admin'],['edit','Editor'],['view','Read only']];
const roleName=p=>isOwner(p.name)?'Admin':(ROLES.find(r=>r[0]===p.role)||ROLES[1])[1];
const user=()=>{const m=me();return m?m.name:'auto';};
function roBlock(){if(isRO()){alert('Your account is read only.\n\nYou can view, print and export everything, but not change it. Ask '+APP_ADMIN+' if you need to edit.');return true;}return false;}

let S={settings:null,rooms:{},blockers:{},log:[],snaps:[],pins:{},plans:{}};
let F={view:'overview',mx:'act',sub:'all',resp:'all',floor:'all',next:'all',type:'all',q:'',blk:'all',colorBy:'next',quick:false,bStatus:'open',bFloor:'all',bCat:'all',bOwner:'all',bGroup:'none',bq:''};

/* Hold points: a library activity with hp:true gets a linked step "<id>__hp" right after it in the sequence */
const HP='__hp';
const isHP=id=>String(id).endsWith(HP);
const mainOf=id=>isHP(id)?id.slice(0,-HP.length):id;
function actById(id){const a=S.settings.acts.find(x=>x.id===mainOf(id));if(!a||!isHP(id))return a;return {id,main:a.id,isHp:true,name:'HP – '+a.name,short:'HP',color:a.color};}
const allSteps=()=>{const o=[];S.settings.acts.forEach(a=>{o.push(a);if(a.hp)o.push(actById(a.id+HP));});return o;};
const lbls=id=>isHP(id)?['Pending','Inspection requested','Released']:['To do','In progress','Done'];
const lbl=(id,s)=>lbls(id)[s]||'';
const stepLabel=(r,id)=>{const a=actById(id),s=st(r,id);if(a.isHp)return (s===1?'Inspection requested':'Awaiting HP')+': <b>'+esc(a.name.slice(5))+'</b>';return (s===1?'In progress':'Next')+': <b>'+esc(a.name)+'</b>';};
const floorById=id=>S.settings.floors.find(f=>f.id===id);
const typeById=id=>S.settings.types.find(t=>t.id===id);
const floorIdx=id=>{const i=S.settings.floors.findIndex(f=>f.id===id);return i<0?999:i;};
/* A room's sequence is the ORDER of r.acts (copied from its template, re-orderable per room); each activity
   flagged as hold point gets its HP step right after it. */
function roomActs(r){const o=[],seen={};(r.acts||[]).forEach(id=>{if(seen[id])return;seen[id]=1;const a=S.settings.acts.find(x=>x.id===id);if(!a)return;o.push(id);if(a.hp&&!(r.hpOff||[]).includes(id))o.push(id+HP);});return o;}
const cleanSeq=l=>{const seen={};return (l||[]).filter(x=>{if(seen[x]||!S.settings.acts.some(a=>a.id===x))return false;return seen[x]=1;});};
const libOrd=id=>S.settings.acts.findIndex(a=>a.id===id);
/* Assignment: each activity has a default subcontractor (settings.subs id) and responsible (team member),
   overridable per room in r.asg[actId]. A hold point uses the responsible of its activity. */
const subName=id=>{const s=(S.settings.subs||[]).find(x=>x.id===id);return s?s.name:'';};
function asg(r,stepId){const m=mainOf(stepId),o=(r&&r.asg&&r.asg[m])||{},a=S.settings.acts.find(x=>x.id===m)||{};return {sub:o.sub||a.sub||'',resp:o.resp||a.resp||'',ov:!!(o.sub||o.resp)};}
function asgModal(rid,aid){
  const r=S.rooms[rid],a=actById(aid),o=(r.asg&&r.asg[aid])||{},subs=S.settings.subs||[];
  modal(`<h2>${esc(r.code)} · ${esc(a.name)}</h2><p style="margin-top:0;color:var(--mute);font-size:12px">Leave “Default” to follow the activity library.</p><div class="form">
    <label>Subcontractor<select id="as_sub"><option value="">Default: ${esc(subName(a.sub)||'none')}</option>${subs.map(s=>`<option value="${s.id}" ${o.sub===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label>Responsible<select id="as_resp"><option value="">Default: ${esc(a.resp||'none')}</option>${people().map(p=>`<option value="${esc(p.name)}" ${o.resp===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <div class="row"><button class="btn pri" id="as_ok">Save</button><button class="btn" id="as_x">Cancel</button></div></div>`);
  $('#as_x').onclick=closeModal;
  $('#as_ok').onclick=()=>{store.patchRoom(rid,{['asg.'+aid]:{sub:$('#as_sub').value,resp:$('#as_resp').value}});closeModal();};
}
function setSeq(kind,id,fn){if(kind==='type')saveS(s=>{const t=s.types.find(x=>x.id===id);if(t)t.acts=fn(cleanSeq(t.acts));});else{const r=S.rooms[id];if(r)store.patchRoom(id,{acts:fn(cleanSeq(r.acts))});}}
function seqEditor(kind,id,list){
  list=cleanSeq(list);const avail=S.settings.acts.filter(a=>!list.includes(a.id));const r=kind==='room'?S.rooms[id]:null;
  return `<div class="seqed">${list.length?'':'<div class="empty" style="padding:6px">No activity yet — add the first one below.</div>'}${list.map((aid,i)=>{const a=actById(aid),hpOn=a.hp&&!(r&&(r.hpOff||[]).includes(aid));

    <div class="row" style="margin-top:6px"><select data-sqadd="${kind}|${id}"><option value="">+ Add an activity to the sequence…</option>${avail.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><button class="btn sm" data-sqsort="${kind}|${id}" title="Re-order like the activity library">Sort as library</button></div></div>`;
}
const st=(r,a)=>(r.st&&r.st[a]&&r.st[a].s)||0;
const openBlk=(r,a)=>Object.values(S.blockers).filter(b=>b.status==='open'&&b.roomId===r.id&&(a===undefined||b.actId===a));
function progress(r){const ids=roomActs(r);if(!ids.length)return 0;return avg(ids.map(a=>{const s=st(r,a);return s===2?1:s===1?.5:0;}));}
const nextStep=r=>roomActs(r).find(a=>st(r,a)!==2)||null;
const roomsList=()=>Object.values(S.rooms).sort((a,b)=>floorIdx(a.floor)-floorIdx(b.floor)||String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
function passes(r,skipNext){
  if(F.floor!=='all'&&r.floor!==F.floor)return false;
  if(F.type!=='all'&&r.type!==F.type)return false;
  if(F.q){const q=F.q.toLowerCase();if(!(`${r.code} ${r.name}`.toLowerCase().includes(q)))return false;}
  const bk=openBlk(r).length>0;if(F.blk==='yes'&&!bk)return false;if(F.blk==='no'&&bk)return false;
  if(F.sub!=='all'||F.resp!=='all'){const n=nextStep(r);if(!n)return false;const g=asg(r,n);if(F.sub!=='all'&&g.sub!==F.sub)return false;if(F.resp!=='all'&&g.resp!==F.resp)return false;}
  if(!skipNext&&F.next!=='all'){const n=nextStep(r);if(F.next==='__done'){if(n)return false;}else if(n!==F.next)return false;}
  return true;
}
const filtered=()=>roomsList().filter(r=>passes(r,false));

/* ===================== STORE (Firestore or local) ===================== */
let db,fb;
const dref=(c,id)=>fb.doc(db,P+c,id);
function setPath(o,path,v){const k=path.split('.');for(let i=0;i<k.length-1;i++){o[k[i]]=o[k[i]]||{};o=o[k[i]];}o[k[k.length-1]]=v;}
function persist(){lsSet(LSK,JSON.stringify(S));render();}
async function runOps(ops){for(let i=0;i<ops.length;i+=400){const b=fb.writeBatch(db);ops.slice(i,i+400).forEach(([k,c,id,v])=>k==='del'?b.delete(dref(c,id)):b.set(dref(c,id),v));await b.commit();}}
const fail=e=>{console.error(e);alert('Save failed: '+e.message);};
const store={
  saveSettings(s){if(roBlock())return;if(USE_FB)return fb.setDoc(dref('settings','main'),s).catch(fail);S.settings=s;persist();},
  setRoom(r){if(roBlock())return;if(USE_FB)return fb.setDoc(dref('rooms',r.id),r).catch(fail);S.rooms[r.id]=r;persist();},
  patchRoom(id,patch){if(roBlock())return;if(USE_FB)return fb.updateDoc(dref('rooms',id),patch).catch(fail);for(const k in patch)setPath(S.rooms[id],k,patch[k]);persist();},
  setBlocker(b){if(roBlock())return;if(USE_FB)return fb.setDoc(dref('blockers',b.id),b).catch(fail);S.blockers[b.id]=b;persist();},
  delBlocker(id){if(roBlock())return;if(USE_FB)return fb.deleteDoc(dref('blockers',id)).catch(fail);delete S.blockers[id];persist();},
  addLog(e){if(USE_FB)return fb.addDoc(fb.collection(db,P+'log'),e).catch(()=>{});S.log.unshift(e);S.log=S.log.slice(0,1500);},
  savePin(name,hash){if(USE_FB)return fb.setDoc(dref('auth','pins'),{[name]:hash},{merge:true});S.pins[name]=hash;persist();return Promise.resolve();},
  resetPin(name){if(USE_FB)return fb.setDoc(dref('auth','pins'),{[name]:fb.deleteField()},{merge:true}).catch(fail);delete S.pins[name];persist();},
  saveSnaps(list){if(!list.length)return;if(USE_FB)return runOps(list.map(x=>['set','snapshots',x.id,x])).catch(e=>console.error(e));list.forEach(x=>{S.snaps=S.snaps.filter(y=>y.id!==x.id);S.snaps.push(x);});persist();},
  async savePlan(fid,meta,str,prog){if(roBlock())return;const old=S.plans[fid];
    if(USE_FB){for(let i=0;i<meta.chunks;i++){prog&&prog(i+1,meta.chunks);await fb.setDoc(dref('planchunks',`${fid}_${meta.ver}_${i}`),{d:str.slice(i*CHUNK,(i+1)*CHUNK)});}
      await fb.setDoc(dref('plans',fid),meta);
      if(old&&old.ver!==meta.ver)runOps(Array.from({length:old.chunks||0},(_,i)=>['del','planchunks',`${fid}_${old.ver}_${i}`])).catch(e=>console.error(e));return;}
    PLAN.mem[fid]=str;try{localStorage.setItem('rtft_plan_'+fid,str);}catch(e){alert('Local mode: this PDF is too big to be kept in the browser and will be lost when the page is reloaded.');}
    S.plans[fid]=meta;persist();},
  async loadPlanFile(fid,m){
    if(USE_FB){const ds=await Promise.all(Array.from({length:m.chunks},(_,i)=>fb.getDoc(dref('planchunks',`${fid}_${m.ver}_${i}`))));if(ds.some(d=>!d.exists()))throw new Error('The plan file is incomplete — please upload it again.');return ds.map(d=>d.data().d).join('');}
    const v=PLAN.mem[fid]||lsGet('rtft_plan_'+fid,'');if(!v)throw new Error('The PDF is no longer in this browser — please upload it again.');return v;},
  patchPlan(fid,patch){if(roBlock())return;
    if(USE_FB){const p={};for(const k in patch)p[k]=patch[k]===null?fb.deleteField():patch[k];return fb.updateDoc(dref('plans',fid),p).catch(fail);}
    const m=S.plans[fid];if(!m)return;for(const k in patch){if(patch[k]===null){const ks=k.split('.');let o=m;for(let i=0;i<ks.length-1;i++)o=o[ks[i]]||{};delete o[ks[ks.length-1]];}else setPath(m,k,patch[k]);}persist();},
  delPlan(fid){if(roBlock())return;const m=S.plans[fid];if(!m)return;
    if(USE_FB)return runOps([['del','plans',fid],...Array.from({length:m.chunks||0},(_,i)=>['del','planchunks',`${fid}_${m.ver}_${i}`])]).catch(fail);
    delete PLAN.mem[fid];try{localStorage.removeItem('rtft_plan_'+fid);}catch(e){}delete S.plans[fid];persist();},
  async addRooms(rooms){if(roBlock())return;if(USE_FB)return runOps(rooms.map(r=>['set','rooms',r.id,r])).catch(fail);rooms.forEach(r=>S.rooms[r.id]=r);persist();},
  async delRooms(roomIds,blkIds){if(roBlock())return;if(USE_FB)return runOps([...roomIds.map(id=>['del','rooms',id]),...blkIds.map(id=>['del','blockers',id])]).catch(fail);roomIds.forEach(id=>delete S.rooms[id]);blkIds.forEach(id=>delete S.blockers[id]);persist();},
  async replaceAll(d){if(roBlock())return;
    const rooms=Array.isArray(d.rooms)?d.rooms:Object.values(d.rooms||{});
    const blks=Array.isArray(d.blockers)?d.blockers:Object.values(d.blockers||{});
    if(USE_FB){
      const ops=[...Object.keys(S.rooms).map(id=>['del','rooms',id]),...Object.keys(S.blockers).map(id=>['del','blockers',id]),['set','settings','main',d.settings],...rooms.map(r=>['set','rooms',r.id,r]),...blks.map(b=>['set','blockers',b.id,b])];
      return runOps(ops).catch(fail);
    }
    S.settings=d.settings;S.rooms={};rooms.forEach(r=>S.rooms[r.id]=r);S.blockers={};blks.forEach(b=>S.blockers[b.id]=b);persist();
  }
};
async function initFB(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [app,fs,au]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
  const a=app.initializeApp(FIREBASE_CONFIG);db=fs.getFirestore(a);fb=fs;
  await au.signInAnonymously(au.getAuth(a));
  const got={s:0,r:0,b:0,n:0,p:0};let booted=false;
  return new Promise((res,rej)=>{
    const ready=()=>{if(got.s&&got.r&&got.b&&got.n&&got.p){if(!booted){booted=true;res();}else render();}};
    fs.onSnapshot(dref('auth','pins'),d=>{S.pins=d.exists()?d.data():{};got.p=1;ready();},rej);
    fs.onSnapshot(fs.collection(db,P+'snapshots'),q=>{S.snaps=q.docs.map(d=>d.data());got.n=1;ready();},rej);
    fs.onSnapshot(dref('settings','main'),d=>{S.settings=d.exists()?d.data():null;got.s=1;ready();},rej);
    fs.onSnapshot(fs.collection(db,P+'rooms'),q=>{S.rooms={};q.forEach(d=>S.rooms[d.id]=d.data());got.r=1;ready();},rej);
    fs.onSnapshot(fs.collection(db,P+'blockers'),q=>{S.blockers={};q.forEach(d=>S.blockers[d.id]=d.data());got.b=1;ready();},rej);
    fs.onSnapshot(fs.collection(db,P+'plans'),q=>{S.plans={};q.forEach(d=>S.plans[d.id]=d.data());if(booted)render();},e=>console.error(e));
    fs.onSnapshot(fs.query(fs.collection(db,P+'log'),fs.orderBy('ts','desc'),fs.limit(400)),q=>{S.log=q.docs.map(d=>d.data());if(booted)render();},()=>{});
  });
}

function pinKey(k){
  if(k==='del'){LG.pin=LG.pin.slice(0,-1);LG.err='';renderLogin();return;}
  if(LG.pin.length>=4)return;LG.pin+=k;renderLogin();
  if(LG.pin.length===4)setTimeout(()=>{if(simpleHash(LG.name+LG.pin)===S.pins[LG.name])loginOk(LG.name);else{LG.err='Wrong PIN. Try again.';LG.pin='';renderLogin();}},120);

function loginClick(d){

  if(d.lgback!==undefined){LG={step:'pick',name:'',pin:'',err:''};renderLogin();return;}
  if(d.lgk!==undefined){pinKey(d.lgk);return;}
  if(d.lgset!==undefined){

  }
}

/* Column order for the "by activity" matrix: the template's own sequence when a room type is filtered,
   otherwise the DOMINANT order of the listed rooms (average relative position of each activity). */
function mxColumns(list){
  const used=new Set();list.forEach(r=>cleanSeq(r.acts).forEach(a=>used.add(a)));
  const t=F.type!=='all'?typeById(F.type):null;let order;
  if(t){const ts=cleanSeq(t.acts);order=[...ts,...[...used].filter(a=>!ts.includes(a)).sort((a,b)=>libOrd(a)-libOrd(b))];}
  else{const sum={},n={};list.forEach(r=>{const q=cleanSeq(r.acts);q.forEach((a,i)=>{sum[a]=(sum[a]||0)+(q.length>1?i/(q.length-1):0);n[a]=(n[a]||0)+1;});});
    order=[...used].sort((a,b)=>(sum[a]/n[a])-(sum[b]/n[b])||libOrd(a)-libOrd(b));}
  if(!order.length)order=S.settings.acts.map(a=>a.id);
  const cols=[];order.forEach(id=>{const a=actById(id);if(!a)return;cols.push(a);if(a.hp)cols.push(actById(id+HP));});
  return {order,cols};
}

  h+=seq?Array.from({length:N},(_,i)=>`<th>Step<br><b style="font-size:13px;color:var(--ink)">${i+1}</b></th>`).join('')
        :cols.map(a=>`<th class="${F.next===a.id?'hl':''} ${a.isHp?'hpcol':''}" title="${esc(a.name)}"><div class="vt">${a.isHp?'◆ HP':`<span class="dot" style="background:${a.color}"></span>${esc(a.name)}`}</div></th>`).join('');
  h+=`<th><div class="${seq?'':'vt'}">Progress</div></th></tr></thead><tbody>`;
  s.floors.forEach(f=>{

    h+=`<tr class="fl"><td class="rh">${esc(f.name)}</td><td colspan="${nCols+2}"></td></tr>`;
    rs.forEach(r=>{

      h+=`<tr><td class="rh"><a href="#" tabindex="-1" data-room="${r.id}"><b>${esc(r.code)}</b></a> <span style="color:var(--mute)">${esc(r.name)}</span>${bl.length?` <span class="badge red">⚠${bl.length}</span>`:''}</td><td class="cmt"><input data-hold data-rnote="${r.id}" value="${esc((r.note||'').replace(/\n/g,' · '))}" placeholder="${isRO()?'':'Add a comment…'}" title="${esc(r.note||'')}" ${isRO()?'readonly':''}></td>`;
      const cell=(a,extra,inner,tipStep)=>{const sv=st(r,a.id),b=bl.some(x=>x.actId===a.id),g=asg(r,a.id);
        return `<td class="c s${sv} ${a.isHp?'hp':''} ${b?'b':''} ${F.next===a.id?'hl':''} ${extra}" data-cell="${r.id}|${a.id}" title="${esc(r.code+' · '+tipStep+a.name+' · '+(b?'BLOCKED':lbl(a.id,sv))+(g.sub&&!a.isHp?' · '+subName(g.sub):'')+(g.resp?' · '+g.resp:''))}">${b?'!':inner}</td>`;};
      if(seq){
        for(let i=0;i<N;i++){const id=ra[i];if(!id){h+=`<td class="empty"></td>`;continue;}const a=actById(id);
          h+=cell(a,'cq',a.isHp?'◆':`<span style="${st(r,id)===0?'border-bottom:3px solid '+a.color:''}">${esc(a.short||a.name.slice(0,3))}</span>`,`step ${i+1} · `);}
      }else{

          if(!ra.includes(a.id)){h+=`<td class="na ${F.next===a.id?'hl':''}"></td>`;return;}

    });
  });
  h+='</tbody></table></div>';
  if(!list.length)h+=`<div class="empty">No room matches the current filters.</div>`;
  return h;
}

/* ===================== WEEKLY SNAPSHOTS =====================
   Every Saturday (end of day) the status of every room is frozen in ft_snapshots/<YYYY-MM-DD>.
   No server needed: the first person who opens the app after Saturday creates it. The status
   "as at Saturday" is rebuilt from the start/done dates of each step, so it is exact even if
   the app is only opened on Monday. Missed weeks are filled in the same way. */
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d);};
function lastSaturday(){const d=new Date();let diff=(d.getDay()+1)%7;if(diff===0)diff=7;d.setDate(d.getDate()-diff);return ymd(d);}
function statusAt(r,id,date){const o=r.st&&r.st[id];if(!o||!o.s)return 0;if(o.s===2&&(o.dd||o.d||'')<=date)return 2;if((o.ds||o.d||'')<=date)return 1;return 0;}
const r4=x=>Math.round(x*1e4)/1e4;
function makeSnapshot(date){
  const rooms={},byF={};
  Object.values(S.rooms).forEach(r=>{
    const ids=roomActs(r),stt={};ids.forEach(id=>{const v=statusAt(r,id,date);if(v)stt[id]=v;});
    const p=ids.length?avg(ids.map(id=>[0,.5,1][stt[id]||0])):0;
    rooms[r.id]={f:r.floor,c:r.code,n:r.name,p:r4(p),st:stt};(byF[r.floor]=byF[r.floor]||[]).push(p);
  });
  const floors={};Object.keys(byF).forEach(f=>floors[f]=r4(avg(byF[f])));
  return {id:date,date,takenAt:Date.now(),by:user(),overall:r4(avg(Object.values(rooms).map(x=>x.p))),floors,rooms};
}
let snapDone='';
function ensureSnapshots(){
  if(!S.settings||!Object.keys(S.rooms).length)return;
  const last=lastSaturday(),have=new Set(S.snaps.map(x=>x.id));
  if(have.has(last)||snapDone===last)return;
  const limit=addDays(last,-77);let first;
  if(S.snaps.length)first=addDays([...have].sort().pop(),7);
  else{ // very first run: rebuild history back to the week before the first recorded progress (max 12 weeks)
    let e=today();Object.values(S.rooms).forEach(r=>Object.values(r.st||{}).forEach(o=>{const d=o.ds||o.d;if(o.s&&d&&d<e)e=d;}));
    first=last;while(first>e&&first>limit)first=addDays(first,-7);
  }
  if(first<limit)first=limit;
  const list=[];for(let d=first;d<=last;d=addDays(d,7))if(!have.has(d))list.push(makeSnapshot(d));
  snapDone=last;store.saveSnaps(list);
}
function trendSVG(pts){
  const n=pts.length;if(n<2)return '<div class="empty">The trend curve appears after two weekly snapshots.</div>';
  const W=660,H=230,L=38,R=12,T=10,B=28,x=i=>L+(W-L-R)*i/(n-1),y=p=>T+(H-T-B)*(1-p);
  let g='';for(let k=0;k<=4;k++){const yy=y(k/4);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e6e8ee"/><text x="${L-6}" y="${yy+4}" font-size="10" text-anchor="end" fill="#6a7386">${k*25}%</text>`;}
  const every=Math.ceil(n/9);pts.forEach((p,i)=>{if(i%every===0||i===n-1)g+=`<text x="${x(i)}" y="${H-9}" font-size="10" text-anchor="middle" fill="#6a7386">${p.id==='live'?'Today':fmtD(p.date)}</text>`;});
  const cols=['#e8a33d','#7e57c2','#00897b','#d81b60','#3949ab','#6d4c41'];
  const line=(vals,c,w,dash)=>{const pp=vals.map((v,i)=>v==null?null:x(i).toFixed(1)+','+y(v).toFixed(1)).filter(Boolean);return pp.length>1?`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" ${dash?'stroke-dasharray="5 4"':''} points="${pp.join(' ')}"/>`:'';};
  S.settings.floors.forEach((f,i)=>{g+=line(pts.map(p=>p.floors&&p.floors[f.id]!=null?p.floors[f.id]:null),cols[i%cols.length],1.8);});
  g+=line(pts.map(p=>p.overall),'#13406b',3);
  pts.forEach((p,i)=>{g+=`<circle cx="${x(i)}" cy="${y(p.overall)}" r="3.5" fill="${p.id==='live'?'#fff':'#13406b'}" stroke="#13406b" stroke-width="2"><title>${p.id==='live'?'Today':fmtD(p.date)}: ${pc(p.overall)}%</title></circle>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend" style="margin:6px 0 0"><span><i class="sq" style="background:#13406b;border:0"></i><b>Overall</b></span>${S.settings.floors.map((f,i)=>`<span><i class="sq" style="background:${cols[i%cols.length]};border:0"></i>${esc(f.name)}</span>`).join('')}</div>`;
}
function vWeekly(){
  const s=S.settings,t=today();
  const snaps=[...S.snaps].sort((a,b)=>a.date.localeCompare(b.date));
  let h=`<div class="printonly"><h2 style="margin:0">${esc(s.project)} — Weekly progress report</h2></div>`;
  if(!snaps.length)return h+`<div class="card"><h2>📈 Weekly progress</h2><p>Every Saturday the app automatically saves the status of every room. On Monday this page opens by itself and shows the progress of the week.</p><p style="color:var(--mute)">No snapshot yet: the first one is created as soon as rooms with progress exist and the app is opened after a Saturday.</p></div>`;
  const live={...makeSnapshot('9999-12-31'),id:'live',date:t};
  const sel=F.wk==='live'?live:(snaps.find(x=>x.id===F.wk)||snaps[snaps.length-1]);
  const idx=sel.id==='live'?snaps.length:snaps.findIndex(x=>x.id===sel.id);
  const prev=idx>0?snaps[idx-1]:null;
  const title=sel.id==='live'?`This week so far (live, since Saturday ${fmtD(snaps[snaps.length-1].date)})`:`Week ending Saturday ${fmtLong(sel.date)}`;
  const opts=`<option value="live" ${sel.id==='live'?'selected':''}>This week so far (live)</option>`+[...snaps].reverse().map(x=>`<option value="${x.id}" ${x.id===sel.id?'selected':''}>Week ending Sat ${fmtD(x.date)} ${x.date.slice(0,4)}</option>`).join('');
  h+=`<div class="banner"><div style="flex:1;min-width:220px"><div style="font-size:12px;opacity:.8">${new Date().getDay()===1&&sel.id!=='live'?'Monday report':'Weekly progress'}</div><div style="font-size:18px;font-weight:800">${title}</div>${prev?`<div style="font-size:12px;opacity:.8">compared with Saturday ${fmtD(prev.date)}</div>`:''}</div><select data-fs="wk" class="noprint">${opts}</select><button class="btn sm noprint" data-act="print">🖨 Print</button></div>`;
  // compute changes between prev and sel
  const P0=prev?prev.rooms:{},done={},movers=[],bySub={};let nAct=0,hpRel=0,hpReq=0,started=0;const roomsDone=[],still=[];
  Object.entries(sel.rooms).forEach(([rid,x])=>{
    const o=(P0[rid]&&P0[rid].st)||{};
    Object.entries(x.st).forEach(([id,v])=>{const pv=o[id]||0;
      if(v===2&&pv!==2){(done[id]=done[id]||{})[x.f]=(done[id][x.f]||0)+1;if(isHP(id))hpRel++;else{nAct++;const k=subName(asg(S.rooms[rid],id).sub)||'(no subcontractor)';bySub[k]=(bySub[k]||0)+1;}}
      if(v>=1&&pv===0){if(isHP(id))hpReq++;else started++;}});
    const p0=P0[rid]?P0[rid].p:0,dp=x.p-p0;
    if(x.p>=.9999&&p0<.9999)roomsDone.push(x.c);
    if(dp>0.0001)movers.push({...x,rid,p0,dp});else if(x.p<.9999)still.push(x);
  });
  const from=prev?prev.date:'0000-00-00',to=sel.id==='live'?'9999-12-31':sel.date;
  const bR=Object.values(S.blockers).filter(b=>b.raised&&b.raised>from&&b.raised<=to).length;
  const bC=Object.values(S.blockers).filter(b=>b.closed&&b.closed>from&&b.closed<=to).length;
  const dl=(d,unit='pts')=>d==null?'':`<span class="delta ${d>0.0001?'up':d<-0.0001?'down':'flat'}">${d>0.0001?'▲ +':d<-0.0001?'▼ ':'= '}${Math.round(d*1000)/10} ${unit}</span>`;
  const sinceTxt=prev?'this week':'since start';
  h+=`<div class="kpis"><div class="kpi"><b>${pc(sel.overall)}%</b><span>Overall progress ${prev?dl(sel.overall-prev.overall):''}</span></div>
    <div class="kpi"><b style="color:var(--done)">${nAct}</b><span>Activities completed ${sinceTxt}<br>${started} started</span></div>
    <div class="kpi"><b style="color:var(--hp)">${hpRel}</b><span>◆ Hold points released ${sinceTxt}<br>${hpReq} inspections requested</span></div>
    <div class="kpi"><b>${roomsDone.length}</b><span>Rooms completed ${sinceTxt}</span></div>
    <div class="kpi"><b><span style="color:var(--blk)">${bR}</span> / <span style="color:var(--done)">${bC}</span></b><span>Blocking points raised / resolved ${sinceTxt}</span></div></div>`;
  h+=`<div class="grid2"><div class="card trend"><h2>Progress curve</h2>${trendSVG(sel.id==='live'?[...snaps,live]:snaps.slice(0,idx+1))}</div>`;
  h+=`<div class="card"><h2>By floor</h2><table class="tb"><thead><tr><th>Floor</th>${prev?`<th style="text-align:center">Sat ${fmtD(prev.date)}</th>`:''}<th style="text-align:center">${sel.id==='live'?'Today':'Sat '+fmtD(sel.date)}</th><th style="text-align:center">Change</th><th style="text-align:center">Completed</th></tr></thead><tbody>`;
  s.floors.forEach(f=>{const c=sel.floors[f.id];if(c==null)return;const p0=prev&&prev.floors[f.id]!=null?prev.floors[f.id]:null;const cnt=Object.values(done).reduce((a,o)=>a+(o[f.id]||0),0);
    h+=`<tr><td><b>${esc(f.name)}</b></td>${prev?`<td style="text-align:center">${p0==null?'—':pc(p0)+'%'}</td>`:''}<td style="text-align:center"><b>${pc(c)}%</b></td><td style="text-align:center">${p0==null?'':dl(c-p0)}</td><td style="text-align:center">${cnt}</td></tr>`;});
  h+=`</tbody></table></div></div>`;
  const rows=allSteps().filter(a=>done[a.id]);
  h+=`<div class="card"><h2>Completed ${sinceTxt} — by activity</h2>`;
  h+=rows.length?`<div class="tbwrap"><table class="tb"><thead><tr><th>Activity</th>${s.floors.map(f=>`<th style="text-align:center">${esc(f.name)}</th>`).join('')}<th style="text-align:center">Total</th></tr></thead><tbody>${rows.map(a=>{const o=done[a.id],tot=Object.values(o).reduce((x,y)=>x+y,0);return `<tr><td style="${a.isHp?'padding-left:24px;color:var(--mute)':''}">${a.isHp?`<span class="hptag">◆ HP</span>${esc(a.name.slice(5))} – released`:`<span class="dot" style="background:${a.color}"></span> ${esc(a.name)}`}</td>${s.floors.map(f=>`<td style="text-align:center">${o[f.id]||''}</td>`).join('')}<td style="text-align:center"><b>${tot}</b></td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">No activity completed in this period.</div>';
  h+='</div>';
  const subRows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
  if(subRows.length)h+=`<div class="card"><h2>Completed ${sinceTxt} — by subcontractor</h2><table class="tb"><tbody>${subRows.map(([k,v])=>`<tr><td>🏗 ${esc(k)}</td><td style="text-align:right"><b>${v}</b> activities</td></tr>`).join('')}</tbody></table></div>`;
  movers.sort((a,b)=>b.dp-a.dp);
  h+=`<div class="grid2"><div class="card"><h2>Rooms that progressed (${movers.length})</h2>${movers.length?`<table class="tb"><tbody>${movers.slice(0,15).map(m=>`<tr class="click" data-room="${S.rooms[m.rid]?m.rid:''}"><td><b>${esc(m.c)}</b> ${esc(m.n)}<br><small style="color:var(--mute)">${esc(floorById(m.f)?.name||'')}</small></td><td style="text-align:right;white-space:nowrap">${pc(m.p0)}% → <b>${pc(m.p)}%</b><br>${dl(m.dp,'%')}</td></tr>`).join('')}</tbody></table>${movers.length>15?`<div class="empty">+ ${movers.length-15} more</div>`:''}`:'<div class="empty">No room progressed in this period.</div>'}</div>`;
  h+=`<div class="card"><h2>Rooms without progress (${still.length})</h2>${still.length?`<div class="row">${still.map(x=>`<span class="tag" title="${esc(x.n)} · ${pc(x.p)}%">${esc(x.c)}</span>`).join('')}</div><p style="font-size:12px;color:var(--mute)">Not complete and no step moved in this period — check them against the blocking points list.</p>`:'<div class="empty">Every unfinished room moved this week 👍</div>'}</div></div>`;
  return h;
}

/* ===================== ROOM DRAWER ===================== */
function openRoom(id){drawerRoom=id;$('#drawer').scrollTop=0;renderDrawer();$('#drawer').classList.add('open');$('#scrim').classList.add('open');}
function closeDrawer(){drawerRoom=null;$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');}
function renderDrawer(){
  const r=S.rooms[drawerRoom];if(!r){closeDrawer();return;}
  const D=$('#drawer'),ae=document.activeElement;
  if(ae&&D.contains(ae)&&ae.matches('[data-hold]')){pending=true;return;}
  const sc=D.scrollTop;
  const s=S.settings,f=floorById(r.floor),t=typeById(r.type),n=nextStep(r),p=progress(r),bl=openBlk(r),acts=roomActs(r);
  let h=`<div class="dh"><div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:800">${esc(r.code)} <span style="font-weight:500">${esc(r.name)}</span></div><div style="color:var(--mute);font-size:12px">${esc(f?f.name:'')} · ${esc(t?t.name:'—')}${r.area?' · '+esc(r.area):''}${(()=>{const o=[...new Set(pinSheets(r).filter(m=>m.floor!==r.floor).map(m=>floorById(m.floor)?.name).filter(Boolean))];return o.length?` · <span class="tag" style="background:#e8f0fe;color:var(--hp)">⇕ double height, also on ${esc(o.join(', '))}</span>`:'';})()}${pinSheets(r).length?` · <a href="#" class="lnk" data-showpin="${r.id}">📐 Show on plan</a>`:''}</div></div><button class="iconbtn" data-act="close">✕</button></div>
    <div class="row" style="margin-top:8px"><div class="bar" style="max-width:none"><i style="width:${pc(p)}%"></i></div><b>${pc(p)}%</b></div>
    <div style="margin-top:6px;font-size:13px">${n?`Next step: <b>${esc(actById(n).name)}</b>`:'<b style="color:var(--done)">✓ All activities complete</b>'}${bl.length?` · <span style="color:var(--blk);font-weight:700">⚠ ${bl.length} open blocking point(s)</span>`:''}</div></div><div class="db"><h3>Activities</h3>`;
  if(!acts.length)h+=`<div class="empty">No activity assigned. Open “Customize activities” below.</div>`;
  acts.forEach(id=>{
    const a=actById(id),hp=!!a.isHp,o=(r.st||{})[id]||{},sv=o.s||0,b=bl.filter(x=>x.actId===id);
    const dIn=k=>`<input type="date" class="dt" data-hold data-sdate="${r.id}|${id}|${k}" value="${o[k]||o.d||''}" title="Change date if the work was done on another day">`;
    const meta=sv===2?`${hp?'Released':'Done'} ${dIn('dd')}${o.by?' · '+esc(o.by):''}`:sv===1?`${hp?'Requested':'Started'} ${dIn('ds')}${o.by?' · '+esc(o.by):''}`:'';
    const words=hp?['Pending','Req.','Released']:['To do','WIP','Done'];
    h+=`<div class="arow ${hp?'hp':''} ${b.length?'blk':''}">${hp?'':`<span class="dot" style="background:${a.color}"></span>`}<div class="an">${hp?`<b><span class="hptag">◆ HP</span>Hold point – inspection</b>`:`<b>${esc(a.name)}</b>`}<small>${meta}${b.length?` <span style="color:var(--blk)">⚠ ${esc(b[0].title)}</span>`:''}</small>${(()=>{const g=asg(r,id);return hp?`<small>👷 Inspection by ${esc(g.resp||'—')}</small>`:`<small class="asgl" data-asg="${r.id}|${id}" title="Click to change for this room" style="cursor:pointer">🏗 ${esc(subName(g.sub)||'—')} · 👷 ${esc(g.resp||'—')}${g.ov?' <b style="color:var(--acc)">✎ room-specific</b>':''}</small>`;})()}</div>
      <div class="seg">${[0,1,2].map(k=>`<button class="${sv===k?'on'+k:''} ${hp?'hpb':''}" data-set="${r.id}|${id}|${k}">${words[k]}</button>`).join('')}</div>
      <button class="iconbtn" title="Raise a blocking point on this activity" data-newblk="${r.id}|${id}">⚠</button></div>`;
  });
  const allb=Object.values(S.blockers).filter(b=>b.roomId===r.id).sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1));
  h+=`<h3>Blocking points</h3>`;
  h+=allb.length?allb.map(b=>{const a=b.actId&&actById(b.actId);return `<div class="bcard ${b.status}"><div class="row"><b>${esc(b.no)}</b><span class="tag">${esc(b.cat)}</span>${a?`<span class="tag">${esc(a.name)}</span>`:''}<span class="sp"></span>${b.status==='open'?`<button class="btn sm" data-closeblk="${b.id}">✓ Resolve</button>`:`<span class="tag green">Resolved ${fmtD(b.closed)}</span>`}<button class="btn sm" data-editblk="${b.id}">Edit</button></div><div style="margin:4px 0">${esc(b.title)}</div><small>Responsible: ${esc(b.owner||'—')} · raised ${fmtD(b.raised)}${b.due?' · target '+fmtD(b.due):''}</small></div>`;}).join(''):'<div class="empty">None 👍</div>';
  h+=`<button class="btn" data-newblk="${r.id}|">+ Raise blocking point</button>`;
  h+=`<h3>Notes</h3><textarea data-hold data-rnote="${r.id}" ${isRO()?'readonly':''} rows="3" style="width:100%" placeholder="Site remarks, access, materials…">${esc(r.note||'')}</textarea>`;
  h+=`<details data-dk="room_cust" class="rwonly" style="margin-top:14px"><summary><b>Customize sequence</b> <small style="color:var(--mute)">(${cleanSeq(r.acts).length} activities)</small></summary><div class="row" style="margin:8px 0">Reset from template: <select id="tplsel">${s.types.map(x=>`<option value="${x.id}" ${x.id===r.type?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn sm" data-act="applytpl">Apply</button></div>${seqEditor('room',r.id,r.acts)}</details>`;
  h+=`<details data-dk="room_det" class="rwonly" style="margin-top:6px"><summary><b>Room details</b></summary><div class="form" style="margin-top:8px"><div class="row"><label>Code<input data-hold id="rd_code" value="${esc(r.code)}"></label><label>Floor<select id="rd_floor">${s.floors.map(x=>`<option value="${x.id}" ${x.id===r.floor?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><label>Name<input data-hold id="rd_name" value="${esc(r.name)}"></label><label>Type<select id="rd_type">${s.types.map(x=>`<option value="${x.id}" ${x.id===r.type?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="row"><button class="btn pri" data-act="saveroom">Save details</button><span class="sp"></span><button class="btn red" data-act="delroom">Delete room</button></div></div></details></div>`;
  D.innerHTML=h;
  reopen(D);D.scrollTop=sc;
}

function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';}
function blkModal(bid,roomId,actId){
  const s=S.settings;
  const b=bid?{...S.blockers[bid]}:{id:uid('b'),no:nextBlkNo(),roomId:roomId||'',actId:actId||'',title:'',cat:s.cats[0],owner:'',raised:today(),due:'',status:'open',closed:'',by:user()};

    <div class="row"><button class="btn pri" id="m_save">Save</button><button class="btn" id="m_cancel">Cancel</button>${bid?'<span class="sp"></span><button class="btn red" id="m_del">Delete</button>':''}</div></div>`);

/* ===================== EXCEL ===================== */
function xls(){if(!window.XLSX){alert('Excel library not loaded (check internet connection).');return null;}return XLSX;}
const blkRow=b=>{const r=S.rooms[b.roomId];return {No:b.no,Floor:r?floorById(r.floor)?.name:'',Room:r?r.code:'','Room name':r?r.name:'',Activity:b.actId?actById(b.actId)?.name||'':'General',Description:b.title,Category:b.cat,Responsible:b.owner,Raised:b.raised,Target:b.due,Status:b.status==='open'?'Open':'Resolved',Resolved:b.closed||'','Age (days)':b.status==='open'?days(b.raised||today(),today()):''};};
function exportBlk(){const X=xls();if(!X)return;const wb=X.utils.book_new();X.utils.book_append_sheet(wb,X.utils.json_to_sheet(blkRows().map(blkRow)),'Blocking points');X.writeFile(wb,`RT_BlockingPoints_${today()}.xlsx`);}
function exportAll(){
  const X=xls();if(!X)return;const s=S.settings,wb=X.utils.book_new();
  const steps=allSteps();
  const head=['Floor','Room','Name','Type','Progress %','Next step','Open blockers',...steps.map(a=>a.name),'Notes'];
  const rows=roomsList().map(r=>{const n=nextStep(r),ra=roomActs(r);return [floorById(r.floor)?.name||'',r.code,r.name,typeById(r.type)?.name||'',pc(progress(r)),n?actById(n).name:'Complete',openBlk(r).length,...steps.map(a=>ra.includes(a.id)?(openBlk(r,a.id).length?'BLOCKED':lbl(a.id,st(r,a.id))):'n/a'),r.note||''];});
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([head,...rows]),'Room status');
  X.utils.book_append_sheet(wb,X.utils.json_to_sheet(Object.values(S.blockers).map(blkRow)),'Blocking points');
  const asRows=[];roomsList().forEach(r=>roomActs(r).forEach((id,i)=>{const g=asg(r,id);asRows.push({Floor:floorById(r.floor)?.name||'',Room:r.code,'Room name':r.name,Step:i+1,Activity:actById(id).name,Status:lbl(id,st(r,id)),Subcontractor:isHP(id)?'':subName(g.sub),Responsible:g.resp,'Room-specific':g.ov?'yes':''});}));
  X.utils.book_append_sheet(wb,X.utils.json_to_sheet(asRows),'Sequences & assignments');
  X.utils.book_append_sheet(wb,X.utils.json_to_sheet(S.log.map(l=>({Date:new Date(l.ts).toLocaleString('en-GB'),By:l.by,Room:l.code,Activity:actById(l.actId)?.name||l.actId,From:lbl(l.actId,l.from),To:lbl(l.actId,l.to)}))),'Update log');
  const sn=[...S.snaps].sort((a,b)=>a.date.localeCompare(b.date));
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([['Week ending (Saturday)','Overall %',...s.floors.map(f=>f.name+' %')],...sn.map(x=>[x.date,pc(x.overall),...s.floors.map(f=>x.floors&&x.floors[f.id]!=null?pc(x.floors[f.id]):'')])]),'Weekly snapshots');
  X.writeFile(wb,`RT_FloorTracker_${today()}.xlsx`);
}

const ACT={
  print:()=>window.print(),
  close:closeDrawer,
  user:()=>{if(!confirm('Log out of the Floor Tracker on this device?'))return;lsSet(LSU,'');closeDrawer();showLogin();},
  addsub:()=>{const lines=$('#ns_name').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;saveS(s=>{s.subs=s.subs||[];lines.forEach(n=>{if(!s.subs.some(y=>y.name.toLowerCase()===n.toLowerCase()))s.subs.push({id:uid('s'),name:n});});});},
  addperson:()=>{const lines=$('#np_name').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),role=$('#np_role').value;if(!lines.length)return;
    const have=people().map(p=>normName(p.name));const add=lines.filter((n,i)=>!have.includes(normName(n))&&lines.findIndex(x=>normName(x)===normName(n))===i);
    if(!add.length)return alert('Already in the list.');editPeople(l=>add.forEach(n=>l.push({name:n,role})));},
  xlsblk:exportBlk,
  xlsall:exportAll,
  backup:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S.settings,rooms:S.rooms,blockers:S.blockers},null,1)],{type:'application/json'}));a.download=`RT_FloorTracker_backup_${today()}.json`;a.click();},
  addfloor:()=>saveS(s=>s.floors.push({id:uid('f'),name:'Level '+(s.floors.length+1)})),
  addact:()=>{const n=prompt('Activity name (e.g. Marble polishing):');if(!n)return;saveS(s=>s.acts.push({id:uid('a'),name:n.trim(),short:n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4),color:PALETTE[s.acts.length%PALETTE.length]}));},
  addtype:()=>{const n=prompt('Room type name (e.g. Spa / Pool area):');if(!n)return;saveS(s=>s.types.push({id:uid('t'),name:n.trim(),acts:[]}));},
  addroom:()=>{const code=$('#nr_code').value.trim(),name=$('#nr_name').value.trim(),floor=$('#nr_floor').value,type=$('#nr_type').value;if(!code)return alert('Room code is required.');
    if(Object.values(S.rooms).some(r=>r.floor===floor&&r.code===code))return alert('This code already exists on this floor.');
    store.setRoom({id:uid('r'),floor,code,name,type,acts:[...(typeById(type)?.acts||[])],st:{},note:''});},
  bulk:()=>{
    const txt=$('#bulk').value.trim();if(!txt)return;const s=JSON.parse(JSON.stringify(S.settings));const nr=[];let skip=0;
    txt.split(/\r?\n/).forEach(line=>{const c=line.split(line.includes('\t')?'\t':line.includes(';')?';':',').map(x=>x.trim());if(c.length<2||!c[1]||/^floor$/i.test(c[0]))return;
      let f=s.floors.find(x=>x.name.toLowerCase()===c[0].toLowerCase()||x.id===c[0]);if(!f){f={id:uid('f'),name:c[0]||'Floor'};s.floors.push(f);}
      const tn=(c[3]||'').toLowerCase(),t=s.types.find(x=>x.name.toLowerCase()===tn)||s.types.find(x=>tn&&x.name.toLowerCase().startsWith(tn))||s.types[0];
      if(Object.values(S.rooms).concat(nr).some(r=>r.floor===f.id&&r.code===c[1])){skip++;return;}
      nr.push({id:uid('r'),floor:f.id,code:c[1],name:c[2]||'',type:t?t.id:'',acts:[...(t?t.acts:[])],st:{},note:''});});
    if(!nr.length)return alert(`Nothing to import${skip?` (${skip} duplicate(s) skipped)`:''}.`);
    if(!confirm(`Import ${nr.length} room(s)${skip?` (${skip} duplicate(s) skipped)`:''}?`))return;
    if(s.floors.length!==S.settings.floors.length)store.saveSettings(s);

/* ===================== FLOOR PLANS (PDF) =====================
   A floor can have SEVERAL SHEETS (e.g. a level cut in two: North + South, with an overlap zone).
   Firestore: ft_plans/<sheetId> = {floor, sheet, file info, pins:{roomId:{x,y,m}}} (x,y = 0..1 of the page);
   the PDF itself is cut base64 into ft_planchunks/<sheetId>_<ver>_<i> (a Firestore doc is limited to 1 MB).
   ROOM RECOGNITION (vector PDF exported from AutoCAD/Revit, not a scan): the text layer is read with pdf.js.
   A ROOM TAG is a code-like word (P1.23, 2.05, B2-03…) with an AREA (“39.43 m²”) written just below it,
   the words in between being the room name — this excludes door tags, grid axes, levels, dimensions.
   NO DUPLICATES: a room is identified by its CODE on its floor. The same code found on two sheets (overlap

   where it appears. Positions placed by hand are never overwritten by a later detection. */

    sc.onerror=()=>{pdfjsP=null;rej(new Error('PDF library not loaded (check internet connection).'));};document.head.appendChild(sc);});
  return pdfjsP;
}

const byCode=(a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
const sheetsOf=fid=>Object.entries(S.plans||{}).map(([id,m])=>({id,...m,floor:m.floor||id})).filter(m=>m.floor===fid).sort((a,b)=>(a.ts||0)-(b.ts||0));
/* sheets showing a room: its own floor first, then other floors (double-height rooms, e.g. a P2 plantroom also drawn on P1) */
const pinSheets=r=>{const all=Object.entries(S.plans||{}).map(([id,m])=>({id,...m,floor:m.floor||id})).filter(m=>m.pins&&m.pins[r.id]);return [...all.filter(m=>m.floor===r.floor),...all.filter(m=>m.floor!==r.floor)];};

const kExact=s=>String(s||'').toLowerCase().replace(/\s+/g,'');

document.addEventListener('pointermove',e=>{
  const g=PLAN.drag;if(!g)return;if(!g.moved&&Math.abs(e.clientX-g.sx)+Math.abs(e.clientY-g.sy)<5)return;g.moved=true;
  g.x=clamp01((e.clientX-g.box.left)/g.box.width);g.y=clamp01((e.clientY-g.box.top)/g.box.height);g.el.style.left=g.x*100+'%';g.el.style.top=g.y*100+'%';
});
document.addEventListener('pointerup',()=>{
  const g=PLAN.drag;if(!g)return;PLAN.drag=null;
  if(g.moved){PLAN.sel=g.rid;store.patchPlan(PLAN.pid,{['pins.'+g.rid]:{x:g.x,y:g.y,m:1}});}else PLAN.sel=PLAN.sel===g.rid?null:g.rid;
  render();
});
/* returns true when the click was a plan action */
function planClick(e){
  const pi=e.target.closest('#planin');
  if(pi&&PLAN.edit&&PLAN.place==='__new'&&!e.target.closest('.pin')){const b=pi.getBoundingClientRect();PLAN.place=null;
    newRoomModal(PLAN.pid,clamp01((e.clientX-b.left)/b.width),clamp01((e.clientY-b.top)/b.height));render();return true;}
  if(pi&&PLAN.edit&&PLAN.place&&!e.target.closest('.pin')){const b=pi.getBoundingClientRect(),rid=PLAN.place;PLAN.place=null;PLAN.sel=rid;
    store.patchPlan(PLAN.pid,{['pins.'+rid]:{x:clamp01((e.clientX-b.left)/b.width),y:clamp01((e.clientY-b.top)/b.height),m:1}});render();return true;}
  if(e.target.id==='imp_all'){document.querySelectorAll('[data-imp]').forEach(c=>c.checked=e.target.checked);return true;}
  const t=e.target.closest('[data-pzoom],[data-pplace],[data-punpin],[data-showpin]');if(!t)return false;const d=t.dataset;
  if(d.pzoom){setZoom(+d.pzoom);return true;}
  if(d.pplace!==undefined){PLAN.place=d.pplace||null;render();return true;}
  if(d.punpin){PLAN.sel=null;store.patchPlan(PLAN.pid,{['pins.'+d.punpin]:null});return true;}
  if(d.showpin){e.preventDefault();showOnPlan(d.showpin);return true;}
  return false;
}
/* returns true when the change was a plan action */
function planChange(t){
  const d=t.dataset;
  if(d.planfile&&t.files.length){const fs=[...t.files];t.value='';uploadPlans(d.planfile,fs,d.prep||null);return true;}
  if(d.paddsheet!==undefined){if(t.value){PLAN.place=t.value;render();}return true;}
  if(d.ppage){const pid=d.ppage,n=+t.value,m=S.plans[pid];if(!m)return true;
    if(Object.keys(m.pins||{}).length&&!confirm(`Use page ${n} of the PDF?\n\nThe room positions of this sheet are detected again on that page (positions placed by hand are reset).`)){t.value=m.page||1;return true;}
    Promise.resolve(store.patchPlan(pid,{page:n,pins:{}})).then(()=>{S.plans[pid].page=n;S.plans[pid].pins={};redetect(pid,true);});return true;}
  return false;
}
/* ---- create rooms from the plan ---- */
const typeOpts=sel=>S.settings.types.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('');
const codeTaken=(fid,code)=>Object.values(S.rooms).some(r=>r.floor===fid&&kLoose(r.code)===kLoose(code));
function nextFreeCode(fid){
  const rs=Object.values(S.rooms).filter(r=>r.floor===fid),cnt={};rs.forEach(r=>{const k=roomPre(r.code);cnt[k]=(cnt[k]||0)+1;});
  const pre=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(!pre)return '';
  const sep=(rs.find(r=>roomPre(r.code)===pre).code.charAt(pre.length))||'.';
  // after the highest number (gaps like P1.10 may be rooms of another drawing)
  let n=1+Math.max(0,...rs.filter(r=>roomPre(r.code)===pre).map(r=>{const m=String(r.code).slice(pre.length+1).match(/^\d+/);return m?+m[0]:0;}));
  while(codeTaken(fid,pre+sep+String(n).padStart(2,'0')))n++;return pre+sep+String(n).padStart(2,'0');
}
function newRoomModal(pid,x,y){
  if(!isAdmin()||roBlock())return;const fid=PLAN.fid;PLAN.newAt={pid,fid,x,y};
  modal(`<h2>+ New room on ${esc(floorById(fid)?.name||'')}</h2><div class="form"><div class="row"><label>Code<input id="pn_code" value="${esc(nextFreeCode(fid))}"></label><label style="flex:1">Name<input id="pn_name" placeholder="e.g. Parking zone A"></label></div><label>Room type<select id="pn_type">${typeOpts(S.settings.types[0]&&S.settings.types[0].id)}</select></label></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="pnewok">Create room here</button></div>`);
  setTimeout(()=>{const e=$('#pn_name');if(e)e.focus();},50);
}
async function newRoomOk(){
  const A=PLAN.newAt;if(!A)return;const code=$('#pn_code').value.trim(),name=$('#pn_name').value.trim(),type=$('#pn_type').value,t=typeById(type);
  if(!code)return alert('The code is required.');if(codeTaken(A.fid,code))return alert(`${code} already exists on this floor.`);
  const id=uid('r');closeModal();PLAN.newAt=null;
  await store.setRoom({id,floor:A.fid,code,name,type,acts:[...((t&&t.acts)||[])],st:{},note:''});
  await store.patchPlan(A.pid,{['pins.'+id]:{x:A.x,y:A.y,m:1}});PLAN.sel=id;render();
}
function splitModal(){
  const r=S.rooms[PLAN.sel];if(!r||!isAdmin()||roBlock())return;const nb=openBlk(r).length+Object.values(S.blockers).filter(b=>b.roomId===r.id&&b.status!=='open').length;
  modal(`<h2>✂ Split ${esc(r.code)} ${esc(r.name)}</h2><p style="font-size:13px;color:var(--mute);margin-top:0">Creates several rooms in place of this one (e.g. a big parking zone cut into zones). The new labels are put next to the original one: drag them to their zone.</p>
    <div class="form"><div class="row"><label>Number of rooms<input type="number" id="sp_n" min="2" max="26" value="4" style="width:90px"></label><label>Codes<select id="sp_mode"><option value="A">${esc(r.code)}-A, ${esc(r.code)}-B…</option><option value="1">${esc(r.code)}-1, ${esc(r.code)}-2…</option></select></label></div>
    <label class="chk"><input type="checkbox" id="sp_st" checked>Copy the statuses already entered (${Object.keys(r.st||{}).length})</label>
    <label class="chk"><input type="checkbox" id="sp_del" checked>Delete ${esc(r.code)} after the split${nb?` (its ${nb} blocking point(s) move to the first new room)`:''}</label></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="psplitok">Split</button></div>`);
}
async function splitOk(){
  const r=S.rooms[PLAN.sel],pid=PLAN.pid,m=S.plans[pid];if(!r||!m)return;
  const n=Math.max(2,Math.min(26,parseInt($('#sp_n').value)||0)),mode=$('#sp_mode').value,cp=$('#sp_st').checked,del=$('#sp_del').checked;
  const suf=i=>mode==='A'?String.fromCharCode(65+i):String(i+1);
  const parts=[];for(let i=0;i<n;i++){const code=r.code+'-'+suf(i);if(codeTaken(r.floor,code))return alert(`${code} already exists on this floor.`);
    parts.push({...JSON.parse(JSON.stringify(r)),id:uid('r'),code,name:(r.name?r.name+' ':'')+suf(i),st:cp?JSON.parse(JSON.stringify(r.st||{})):{},note:''});}
  closeModal();
  const p0=(m.pins||{})[r.id]||{x:.5,y:.5},pins={};parts.forEach((q,i)=>{pins['pins.'+q.id]={x:clamp01(p0.x+(i-(n-1)/2)*.03),y:clamp01(p0.y+.02),m:1};});
  if(del)pins['pins.'+r.id]=null;
  await store.addRooms(parts);await store.patchPlan(pid,pins);
  if(del){const bl=Object.values(S.blockers).filter(b=>b.roomId===r.id);for(const b of bl)await store.setBlocker({...b,roomId:parts[0].id});
    if(drawerRoom===r.id)closeDrawer();await store.delRooms([r.id],[]);}
  PLAN.sel=null;render();
}
Object.assign(ACT,{
  pnewok:newRoomOk,
  psplit:splitModal,
  psplitok:splitOk,
  mclose:()=>{PLAN.imp=null;closeModal();},
  pname:()=>{F.pname=F.pname===false;render();},
  pedit:()=>{PLAN.edit=!PLAN.edit;PLAN.place=null;PLAN.sel=null;render();},
  pimpmodal:()=>importModal(PLAN.fid),
  pimport:doImport,
  pdetect:()=>{const m=S.plans[PLAN.pid];if(!m)return;const man=Object.values(m.pins||{}).some(p=>p.m);
    if(man&&!confirm('Detect the rooms of this sheet again from the plan text?\n\nRooms you placed by hand keep their position.'))return;redetect(PLAN.pid,false);},
  prename:()=>{const m=S.plans[PLAN.pid];if(!m)return;const n=prompt('Sheet name (e.g. North, South, Part A):',m.sheet||'');if(n&&n.trim())store.patchPlan(PLAN.pid,{sheet:n.trim()});},
  pdel:()=>{const m=S.plans[PLAN.pid];if(!m||!confirm(`Remove the sheet “${m.sheet||m.name}” (${m.name}) from ${floorById(PLAN.fid)?.name||'this floor'}?\n\nRoom positions on this sheet are deleted too. Rooms and statuses are not affected.`))return;store.delPlan(PLAN.pid);},
  pretry:()=>{const k=planKey(PLAN.pid);delete PLAN.img[k];delete PLAN.pdf[PLAN.pid+'|'+(S.plans[PLAN.pid]||{}).ver];render();},
});

/* ===================== BOOT ===================== */
(async function boot(){
  if(USE_FB){
    $('#sync').textContent='● Connecting…';
    try{await initFB();$('#sync').textContent='🟢 Live · shared';}
    catch(err){$('#sync').textContent='🔴 Offline';$('#view').innerHTML=`<div class="card"><h2>Connection problem</h2><p>${esc(err.message)}</p><p>Check in the Firebase console: Firestore database created · Authentication → Anonymous sign-in enabled · Firestore rules published.</p></div>`;return;}
  }else{
    let d={};try{d=JSON.parse(lsGet(LSK,'{}'))||{};}catch(e){}
    S={settings:d.settings||null,rooms:d.rooms||{},blockers:d.blockers||{},log:d.log||[],snaps:d.snaps||[],pins:d.pins||{},plans:d.plans||{}};
    $('#sync').textContent='🟡 Local mode';
  }
  // Monday: first opening of the day shows the weekly progress of last week
  if(new Date().getDay()===1&&lsGet('rtft_monday','')!==today()){lsSet('rtft_monday',today());F.view='weekly';F.wk='';}
  // no demo: the very first opening creates an empty project (3 floors, default activities)
  if(!S.settings)store.saveSettings(defaultSettings());else render();
  setInterval(ensureSnapshots,15*60*1000);
})();
</script>
